<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消防救急アシスタント Pro</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">

<body>

<main class="menu container" role="navigation" aria-label="メインメニュー">

    <button class="card" data-target="pages/protocolSelect.html" aria-label="プロトコル">

        <div class="icon">📋</div>
        <span class="label">履歴</span>
    </button>

    <button class="card" data-target="pages/settings.html" aria-label="設定">
        <div class="icon">⚙️</div>
        <span class="label">設定</span>
