<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>消防救急アシスタント Pro</title>

<body>

<main class="menu container" role="navigation" aria-label="メインメニュー">

 <button class="card" data-target="pages/symptoms.html" aria-label="症状を選択">

    <button class="card" data-target="pages/history.html" aria-label="履歴">
