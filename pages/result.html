<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結果</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/result.css?v=2">
</head>

<body>

<header class="header">

    <div class="page-title">
        <h1>判定結果</h1>
    </div>

</header>

<main class="result-page">

    <section class="summary-grid">
        <article class="card summary-card urgency-card"
         id="urgencySection"
         hidden
         aria-live="polite">

    <div class="urgency-left">

    <h2 class="urgency-title">
        🚨 緊急度
    </h2>

    <p id="urgencyStars" class="urgency-stars">
        ★★★★★
    </p>

    <p id="urgencyLabel" class="urgency-label">
        最優先
    </p>

    <p id="urgencyLevel" class="urgency-level">
        LEVEL1
    </p>

</div>

    <div class="urgency-right">

        <div class="urgency-header">

            <h3>判定理由</h3>

            <span id="recommendedAction"
                  class="action-badge">

                🚑直ちに出動

            </span>

        </div>

        <ul id="urgencyReasons"
            class="urgency-reasons">
        </ul>

    </div>

</article>
       
    </section>

     <section class="note-section">
        <article class="card result-card note-card" id="summaryPlaceholder">
            <div class="note-header">
                <h2>📝 申し送り</h2>
                <div class="note-actions">

    <button id="answerPageBtn"
            class="answer-btn">
        📋 回答一覧
    </button>

    <button id="shareBtn" class="share-btn">
    📤 救急隊へ共有
    </button>

</div>
            </div>
            <div class="summary-wrapper">

    <pre id="summaryText"
         class="summary-text">
申し送り情報を生成中です。
    </pre>

</div>
            <p id="copyMessage" class="copy-message" hidden>申し送りをコピーしました</p>
        </article>
    </section>

    <section class="protocol-section">

    <article class="card protocol-card">

        <p id="protocolName">

            読み込み中...

        </p>

    </article>

</section>

<section class="redflag-section">

    <article class="card result-card redflag-card">

        <div class="section-header">

            <h2>🚩 レッドフラッグ</h2>

        </div>

        <ul id="redFlagList"
            class="red-flag-list">

        </ul>

        <p id="noFlagsMessage"
           class="no-flags"
           hidden>

            レッドフラッグは検出されませんでした。

        </p>

    </article>

</section>

    <section class="bottom-actions">
        <button id="saveBtn" class="secondary-btn">💾 保存</button>
        <button id="pdfBtn" class="secondary-btn">
            PDF
        </button>
    </section>
</main>
<footer class="page-footer">
    <p>消防救急アシスタント Pro</p>
    <p>Version 1.0</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script type="module" src="../js/router.js"></script>
<script type="module" src="../js/pages/result.js"></script>

</body>
</html>
