<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結果</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/result.css">
</head>
<body>
<header class="header">
    <div class="container">
        <h1>判定結果</h1>
        <p>消防指令員が最初に見る判断画面です。</p>
    </div>

           <div class="dispatch-item">
            <strong>プロトコル</strong>
            <span id="dispatchSymptom">胸痛</span>
        </div>
</header>

    <section class="summary-grid">
        <article class="card summary-card urgency-card" id="urgencySection" hidden aria-live="polite">
            <div class="urgency-top-row">
                <h2>🚨 緊急度</h2>
                <span id="recommendedAction" class="action-badge">推奨対応</span>
            </div>
            <p id="urgencyStars" class="urgency-stars">★★★★★</p>
            <p id="urgencyLevel" class="urgency-level">LEVEL1</p>
            <p id="urgencyLabel" class="urgency-label">最優先</p>
            <hr class="section-divider">
            <h3>判定理由</h3>
            <ul id="urgencyReasons" class="urgency-reasons"></ul>
        </article>
       
    </section>

     <section class="note-section">
        <article class="card result-card note-card" id="summaryPlaceholder">
            <div class="note-header">
                <h2>📝 申し送り</h2>
                <div class="note-actions">
                    <button type="button" id="copySummaryBtn" class="copy-btn">コピー</button>
                    <button type="button" id="clearSummaryBtn" class="clear-btn">クリア</button>
                </div>
            </div>
            <pre id="summaryText" class="summary-text">申し送り情報を生成中です。</pre>
            <p id="copyMessage" class="copy-message" hidden>申し送りをコピーしました</p>
            <p id="clearMessage" class="clear-message" hidden>申し送りをクリアしました</p>
        </article>
    </section>

    <section class="detail-grid" aria-label="レッドフラッグ">
        <article class="card result-card redflag-card">
            <div class="section-header">
                <h2>🚩 レッドフラッグ</h2>
                <span class="section-tag">重要</span>
            </div>
            <ul id="redFlagList" class="red-flag-list"></ul>
            <p id="noFlagsMessage" class="no-flags" hidden>レッドフラッグは検出されませんでした。</p>
        </article>
        <article class="card summary-card protocol-card">
    
            <p id="protocolName">読み込み中...</p>
        </article> 
    </section>

    <section class="answer-section">
        <article class="card result-card answer-card">
            <div class="section-header">
                <h2>📋 回答一覧</h2>
                <span class="section-tag">未回答は非表示</span>
            </div>
            <ul id="answerList" class="qa-list"></ul>
            <p id="answerEmptyText" class="no-data" hidden>回答がありません。</p>
        </article>
    </section>

    <section class="bottom-actions">
        <button id="saveBtn" class="secondary-btn">💾 保存</button>
        <button type="button" class="disabled-btn" disabled>PDF</button>
    </section>
</main>
<footer class="page-footer">
    <p>消防救急アシスタント Pro</p>
    <p>Version 1.0</p>
</footer>
<script type="module" src="../js/router.js"></script>
<script type="module" src="../js/pages/result.js"></script>
</body>
</html>
