<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結果</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/result.css">
</head>
<body>
<header class="header">
    <div class="container">
        <h1>判定結果</h1>
        <p>消防指令員が最初に見る判断画面です。</p>
    </div>
</header>
<main class="container">
    <section class="result-summary">
        <article class="card summary-card">
            <h2>プロトコル名</h2>
            <p id="protocolName">読み込み中...</p>
        </article>
        <article class="card summary-card urgency-card" id="urgencySection" hidden aria-live="polite">
            <h2>🚨 緊急度</h2>
            <hr class="section-divider">
            <p id="urgencyStars" class="urgency-stars">★★★★★</p>
            <p id="urgencyLevel" class="urgency-level">LEVEL1</p>
            <p id="urgencyLabel" class="urgency-label">最優先</p>
            <div>
                <h3>判定理由</h3>
                <ul id="urgencyReasons" class="urgency-reasons"></ul>
            </div>
        </article>
    </section>

    <section class="result-grid" aria-label="結果詳細">
        <article class="card result-card">
            <h2>レッドフラッグ</h2>
            <ul id="redFlagList" class="red-flag-list"></ul>
            <p id="noFlagsMessage" class="no-flags" hidden>レッドフラッグは検出されませんでした。</p>
        </article>
        <article class="card result-card placeholder-summary" id="summaryPlaceholder">
            <h2>申し送り</h2>
            <p>申し送りは次の Sprint で実装予定です。</p>
        </article>
        <article class="card result-card">
            <h2>回答一覧</h2>
            <ul id="answerList" class="answer-list"></ul>
            <p id="answerEmptyText" class="no-data" hidden>回答がありません。</p>
        </article>
    </section>
</main>
<script type="module" src="../js/router.js"></script>
<script type="module" src="../js/pages/result.js"></script>
</body>
</html>
