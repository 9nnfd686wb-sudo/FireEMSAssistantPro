<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロトコル</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/protocol.css">
</head>
<body>
<header class="header">

    <div class="container">

        <div class="header-top">

            <button id="prevBtn" class="back-btn">

                ← 戻る

            </button>

            <h1 id="protocolTitle">

                プロトコル

            </h1>

        </div>

        <p id="protocolProgress">

            質問 1 / 10

        </p>

    </div>

</header>

<main class="container protocol-container">

    <section class="card protocol-card">
        <div class="protocol-header">

<h2 id="questionText"
    class="protocol-question-title">
</h2>

<p id="progressText"
   class="protocol-progress">
</p>

</div>
        <div id="questionContainer" class="question-block"></div>
        <div id="validationMessage" class="error-message" aria-live="polite"></div>

</div>

    </section>
</main>
<script type="module" src="../js/router.js"></script>
<script type="module" src="../js/engines/protocolEngine.js"></script>
</body>
</html>
