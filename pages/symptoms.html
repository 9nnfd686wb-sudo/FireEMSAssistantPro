<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>症状選択</title>

<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">

<h1>症状選択</h1>

</header>

<main class="menu">

🚨

<span>CPA</span>

</button>

<button class="card symptom" data-type="consciousness">

🧠

<span>意識障害</span>

</button>

<button class="card symptom" data-type="dyspnea">

🫁

<span>呼吸困難</span>

</button>

<button class="card symptom" data-type="chestPain">

❤️

<span>胸痛</span>

</button>

<button class="card symptom" data-type="abdominal">

🩺

<span>腹痛</span>

</button>

<button class="card symptom" data-type="stroke">

🧠

<span>脳卒中疑い</span>

</button>

<button class="card symptom" data-type="trauma">

🤕

<span>外傷</span>

</button>

<button class="card symptom" data-type="heat">

🌡️

<span>熱中症</span>

</button>

<button class="card symptom" data-type="pediatric">

👶

<span>小児</span>

</button>

<button class="card symptom" data-type="other">

➕

<span>その他</span>

</button>

</main>

</html>
